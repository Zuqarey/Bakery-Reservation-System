<!DOCTYPE html>
<html lang="en">

<!--HTML-->
<head>
    <meta charset="UTF-8">
    <title>Cozy Bake : Best Bakery Shop Malaysia</title>

    <!--CSS-->
    <style>
        body {
            margin: 0;
            background-color: #FAF8F5;
            font-family: hajar;
        }

        header {
            padding: 20px 60px;
            background-color: #FAF8F5;
            border-bottom: 1px solid #E8DED5;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo h2 {
            color: #B58D6D;
            font-family: Georgia, serif;
            font-size: 36px;
            margin: 0;
        }

        .logo p {
            color: #B58D6D;
            font-size: 10px;
            letter-spacing: 3px;
            margin-top: 5px;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: #3D281B;
            font-size: 14px;
        }

        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 70px 6%;
            gap: 50px;
        }

        .hero-text {
            flex: 1;
        }

        h1 {
            color: #3D281B;
            font-family: Georgia, serif;
            font-size: 65px;
            line-height: 1.15;
        }

        h1 span {
            color: #D99AA5;
            font-style: italic;
        }

        .hero-text p {
            color: #795B4D;
            font-size: 16px;
            line-height: 1.8;
        }

        button {
            background-color: #B58D6D;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            margin-right: 10px;
            margin-top: 15px;
        }

        .hero-image {
            flex: 1;
            min-width: 0;
        }

        .hero-image img {
            width: 100%;
            height: 550px;
            object-fit: cover;
            border-radius: 200px 200px 15px 15px;
        }

        @media (max-width: 768px) {
            header {
                padding: 20px;
                flex-wrap: wrap;
                gap: 15px;
            }

            nav {
                flex-wrap: wrap;
            }

            .hero {
                flex-direction: column;
                padding: 40px 20px;
            }

            h1 {
                font-size: 45px;
            }

            .hero-image {
                width: 100%;
            }

            .hero-image img {
                height: 400px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">
            <h2>Cozy Bake</h2>
            <p>BAKED WITH LOVE</p>
        </div>

    </header>

    <main class="hero">

        <div class="hero-text">
            <h1>
                <p>FRESHLY BAKED. EVERY DAY.</p>
                Little<br>
                moments,<br>
                <span>beautifully<br>baked.</span>
            </h1>

            <p>
                From celebration cakes to your morning pastry,<br>
                everything is made with thoughtful ingredients<br>
                and a little extra care.
            </p>

            <button>Explore our menu</button>
            <button>Custom your cake</button>
        </div>

        <div class="hero-image">
            <img src="image/image/image.png" alt="Cozy Bake Bakery">
        </div>

    </main>

</body>
</html>
