<!--Home Page -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
      <title>Cozy Bake : Best Shop Malaysia</title>

    <style>
       
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #FAF8F5;
            font-family: Arial, sans-serif;
            color: #3D281B;
        }

        /* HEADER */
        header {
            background-color: #FAF8F5;
            border-bottom: 1px solid #E8DED5;
        }

        .logo-section {
            padding: 20px 6%;
        }

        .logo h2 {
            color: #B58D6D;
            font-family: Georgia, serif;
            font-size: 38px;
            margin: 0;
        }

        .logo p {
            color: #B58D6D;
            font-size: 10px;
            letter-spacing: 3px;
            margin: 5px 0 0;
        }

        /* NAVIGATION */
        .navbar {
            width: 100%;
            min-height: 110px;
            padding: 10px 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 25px;
            background-color: #FAF8F5;
            border-top: 1px solid #E8DED5;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 40px;
            flex-shrink: 0;
        }

        .nav-links a {
            color: #3D281B;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
        }

        .nav-links a:hover {
            color: #B58D6D;
        }

        /* RIGHT NAVIGATION */
        .nav-right {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        /* SEARCH BAR */
        .search-box {
            width: 288px;
            height: 50px;
            display: flex;
            align-items: center;
            border: 1px solid #E4D2C2;
            border-radius: 30px;
            padding: 0 15px;
            flex-shrink: 0;
        }

        .search-box input {
            width: 100%;
            min-width: 0;
            border: none;
            outline: none;
            background: transparent;
            padding: 10px;
            font-size: 14px;
            color: #3D281B;
        }

        .search-box input::placeholder {
            color: #A9A09A;
        }

        .search-box button {
            background: transparent;
            color: #B58D6D;
            border: none;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            padding: 0;
            white-space: nowrap;
        }

        .search-icon {
            width: 17px;
            height: 17px;
            fill: none;
            stroke: #3D281B;
            stroke-width: 1.7;
        }

        /* NAVIGATION ICONS */
        .icon-btn {
            background: transparent;
            border: none;
            padding: 5px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .icon-btn svg {
            width: 25px;
            height: 25px;
            fill: none;
            stroke: #3D281B;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .icon-btn:hover svg {
            stroke: #B58D6D;
        }

        /* HERO SECTION */
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 50px;
            padding: 70px 6%;
        }

        .hero-text {
            flex: 1;
            min-width: 0;
        }

        .subtitle {
            color: #B58D6D;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .hero-text h1 {
            color: #3D281B;
            font-family: Georgia, serif;
            font-size: clamp(38px, 5vw, 65px);
            line-height: 1.15;
            margin: 20px 0;
        }

        .hero-text h1 span {
            color: #D99AA5;
            font-style: italic;
        }

        .description {
            color: #795B4D;
            font-size: 16px;
            line-height: 1.8;
            max-width: 480px;
        }

       
        .hero-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 30px;
        }

        .hero-buttons button {
            padding: 15px 28px;
            background-color: #B58D6D;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 14px;
            cursor: pointer;
        }

        .hero-buttons button:hover {
            background-color: #967052;
        }

        .hero-buttons .second-button {
            background-color: transparent;
            color: #B58D6D;
            border: 1px solid #B58D6D;
        }

        .hero-buttons .second-button:hover {
            background-color: #E8DED5;
        }

        /* HERO IMAGE */
        .hero-image {
            flex: 1;
            min-width: 0;
        }

        .hero-image img {
            display: block;
            width: 100%;
            height: 500px;
            object-fit: cover;
            border-radius: 200px 200px 20px 20px;
        }

        /* RESPONSIVE */
        @media (max-width: 1250px) {
            .navbar {
                flex-wrap: wrap;
                justify-content: center;
                padding: 20px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
                gap: 25px;
            }

            .nav-right {
                justify-content: center;
            }
        }

        @media (max-width: 768px) {
            .logo-section {
                text-align: center;
            }

            .navbar {
                gap: 20px;
            }

            .nav-links {
                gap: 18px;
            }

            .nav-links a {
                font-size: 14px;
            }

            .nav-right {
                flex-wrap: wrap;
                gap: 18px;
            }

            .search-box {
                width: min(288px, 90vw);
            }

            .hero {
                flex-direction: column;
                padding: 40px 20px;
                gap: 35px;
            }

            .hero-text,
            .hero-image {
                width: 100%;
            }

            .hero-text h1 {
                font-size: 45px;
            }

            .hero-image img {
                height: 400px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>

        <!-- LOGO -->
        <div class="logo-section">
            <div class="logo">
                <h2>Cozy Bake</h2>
                <p>BAKED WITH LOVE</p>
            </div>
        </div>

        <!-- NAVIGATION BAR -->
        <nav class="navbar">

            <!-- LEFT MENU -->
            <div class="nav-links">
                <a href="menu.html">Menu</a>
                <a href="#">Locations</a>
                <a href="#">Reservations</a>
                <a href="#">Ask Me</a>
                
            </div>

            <!-- RIGHT SIDE -->
            <div class="nav-right">

                <!-- SEARCH -->
                <form class="search-box" onsubmit="return false;">

                    <svg class="search-icon" viewBox="0 0 24 24">
                        <circle cx="10.5" cy="10.5" r="6.5"/>
                        <path d="M16 16L21 21"/>
                    </svg>

                    <input
                        type="search"
                        placeholder="Search treats"
                        aria-label="Search treats"
                    >

                    <button type="submit">SEARCH</button>

                </form>

                <!-- NOTIFICATION -->
                <button class="icon-btn" type="button"
                    aria-label="Notifications">

                    <svg viewBox="0 0 24 24">
                        <path d="M18 8a6 6 0 0 0-12 0
                                 c0 7-3 7-3 9h18
                                 c0-2-3-2-3-9"/>
                        <path d="M10 21h4"/>
                    </svg>

                </button>

              <!-- ACCOUNT -->
<button class="icon-btn" type="button"
    aria-label="Account"
    onclick="window.location.href='login.html'">

    <svg viewBox="0 0 24 24">
        <circle cx="12" cy="7" r="4"/>
        <path d="M4 21v-2a8 8 0 0 1 16 0v2z"/>
    </svg>

</button>

                <!-- SHOPPING CART -->
                <button class="icon-btn" type="button"
                    aria-label="Shopping cart">

                    <svg viewBox="0 0 24 24">
                        <circle cx="9" cy="21" r="1"/>
                        <circle cx="19" cy="21" r="1"/>
                        <path d="M2 3h3l3 13h12l3-10H6"/>
                    </svg>

                </button>

            </div>

        </nav>

    </header>

    <!-- HOMEPAGE -->
    <main class="hero">

        <!-- LEFT TEXT -->
        <div class="hero-text">

            <p class="subtitle">
                FRESHLY BAKED. EVERY DAY.
            </p>

            <h1>
                Little<br>
                moments,<br>
                <span>beautifully<br>baked.</span>
            </h1>

            <p class="description">
                From celebration cakes to your morning pastry,
                everything is made with thoughtful ingredients
                and a little extra care.
            </p>

            <div class="hero-buttons">
                </button>

                <button type="button" class="second-button">
                    Custom your cake
                </button>
            </div>

        </div>

        <!-- RIGHT IMAGE -->
        <div class="hero-image">
            <img src="bakery.jpg" alt="Cozy Bake Bakery">
        </div>

    </main>

</body>
</html>
