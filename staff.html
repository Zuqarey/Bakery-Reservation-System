<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cozy Bake - Staff Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --header-bg: #ab8261;
      --header-bg-hover: #987252;
      --body-bg: #fffdf9;
      --active-role-bg: #5c2d18;
      --border-color: #e5ccb6;
      --input-border: #ebd9c8;
      --text-brown: #6b4d38;
      --text-dark: #3a2518;
      --btn-bg: #ab8261;
      --btn-hover: #946f51;
      --backdrop-bg: rgba(40, 30, 25, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #2d1f18 0%, #1a100b 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Modal Container */
    .modal-card {
      background-color: var(--body-bg);
      width: 100%;
      max-width: 460px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      position: relative;
    }

    /* Header Section */
    .modal-header {
      background-color: var(--header-bg);
      padding: 24px 28px 22px;
      color: #ffffff;
      position: relative;
    }

    .brand-title {
      font-size: 0.8rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      font-weight: 700;
      opacity: 0.9;
      margin-bottom: 2px;
    }

    .welcome-text {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 500;
      line-height: 1.1;
    }

    .close-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.4);
      background: transparent;
      color: #ffffff;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.05);
    }

    /* Content Section */
    .modal-body {
      padding: 24px 28px 30px;
    }

    /* Role Badge (Staff Only) */
    .role-badge-container {
      background-color: #f5eafe;
      background: #f7ede2;
      padding: 6px;
      border-radius: 14px;
      margin-bottom: 24px;
      display: flex;
    }

    .role-badge {
      width: 100%;
      text-align: center;
      padding: 12px 16px;
      background-color: var(--active-role-bg);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      border-radius: 10px;
      text-transform: uppercase;
      box-shadow: 0 4px 10px rgba(92, 45, 24, 0.2);
    }

    /* Navigation Tabs */
    .tab-navigation {
      display: flex;
      gap: 20px;
      border-bottom: 1px solid #ebd9c8;
      margin-bottom: 24px;
    }

    .tab-btn {
      background: none;
      border: none;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 1px;
      padding-bottom: 10px;
      color: #a08c7d;
      cursor: pointer;
      text-transform: uppercase;
      position: relative;
    }

    .tab-btn.active {
      color: var(--text-brown);
    }

    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
      height: 2px;
      background-color: var(--text-brown);
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 1.2px;
      color: var(--text-brown);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid var(--input-border);
      border-radius: 12px;
      font-size: 0.95rem;
      color: var(--text-dark);
      background-color: #ffffff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input::placeholder {
      color: #c4b3a4;
    }

    .form-input:focus {
      border-color: var(--header-bg);
      box-shadow: 0 0 0 3px rgba(171, 130, 97, 0.15);
    }

    /* Action Button */
    .submit-btn {
      width: 100%;
      padding: 16px;
      background-color: var(--btn-bg);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s, transform 0.1s;
      box-shadow: 0 4px 12px rgba(171, 130, 97, 0.3);
    }

    .submit-btn:hover {
      background-color: var(--btn-hover);
    }

    .submit-btn:active {
      transform: scale(0.99);
    }
  </style>
</head>
<body>

  <div class="modal-card">
    <!-- Header -->
    <div class="modal-header">
      <div class="brand-title">Cozy Bake</div>
      <div class="welcome-text">Welcome in</div>
      <button class="close-btn" aria-label="Tutup">&times;</button>
    </div>

    <!-- Body -->
    <div class="modal-body">
      <!-- Badge Peranan Staff sahaja -->
      <div class="role-badge-container">
        <div class="role-badge">Staff</div>
      </div>

      <!-- Navigation Tab -->
      <div class="tab-navigation">
        <button class="tab-btn active">Log In</button>
        <button class="tab-btn">Create Account</button>
      </div>

      
      <form onsubmit="event.preventDefault(); alert('Log masuk Staff berjaya!');">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-input" placeholder="Your name" required>
        </div>

        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" placeholder="staff@cozybake.com" value="staff@cozybake.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" class="submit-btn">Log In As Staff</button>
      </form>
    </div>
  </div>

</body>
</html>
