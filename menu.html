<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy Bake | Our Menu</title>

    <style>
        :root {
            --cream: #FAF8F5;
            --brown: #3D281B;
            --accent: #B58D6D;
            --soft: #F1E7DF;
            --line: #E4D1C2;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--cream);
            color: var(--brown);
            font-family: Arial, sans-serif;
        }

        button {
            font-family: inherit;
            cursor: pointer;
        }

        .cart-header {
            display: flex;
            justify-content: flex-end;
            padding: 25px 6% 0;
        }

        .cart-box {
            background: var(--soft);
            color: var(--brown);
            border: none;
            padding: 15px 25px;
            border-radius: 15px;
            font-size: 15px;
            font-weight: bold;
        }

        .cart-box:hover {
            background: var(--line);
        }

        .menu-header {
            text-align: center;
            padding: 35px 20px;
        }

        .menu-header h1 {
            font-family: Georgia, serif;
            font-size: clamp(42px, 7vw, 75px);
            margin: 15px 0;
        }

        .menu-header p {
            color: var(--accent);
            font-size: 15px;
        }

        .categories {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            background: var(--soft);
            padding: 18px;
            margin: 0 6% 35px;
            border-radius: 15px;
        }

        .categories button {
            border: none;
            background: transparent;
            color: var(--brown);
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 15px;
        }

        .categories button.active,
        .categories button:hover {
            background: var(--accent);
            color: white;
        }

        .product-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 28px;
            max-width: 1250px;
            margin: auto;
            padding: 15px 6% 60px;
        }

        .product-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(61, 40, 27, 0.07);
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-image {
            position: relative;
            height: 240px;
            overflow: hidden;
            cursor: pointer;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .product-image:hover img {
            transform: scale(1.05);
        }

        .badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: var(--accent);
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        .product-details {
            padding: 22px;
        }

        .product-details h3 {
            font-size: 20px;
            margin: 0 0 12px;
        }

        .description {
            color: #806B5D;
            font-size: 13px;
            line-height: 1.7;
            min-height: 65px;
        }

        .category-label {
            color: var(--accent);
            font-size: 13px;
        }

        .price {
            font-size: 20px;
            margin: 15px 0;
        }

        .product-actions {
            display: flex;
            gap: 10px;
        }

        .quick-view-btn,
        .add-to-cart {
            border: none;
            border-radius: 12px;
            padding: 13px 12px;
            font-weight: bold;
            font-size: 13px;
        }

        .quick-view-btn {
            flex: 1;
            background: var(--soft);
            color: var(--brown);
        }

        .add-to-cart {
            flex: 1;
            background: var(--accent);
            color: white;
        }

        .quick-view-btn:hover {
            background: var(--line);
        }

        .add-to-cart:hover {
            background: #987356;
        }

        .back-home {
            display: block;
            width: fit-content;
            margin: 0 auto 55px;
            padding: 15px 30px;
            background: var(--brown);
            color: white;
            text-decoration: none;
            border-radius: 25px;
        }

        /* POPUP BACKGROUND */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.55);
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            position: relative;
            background: white;
            border-radius: 22px;
            padding: 28px;
            width: 100%;
            max-width: 650px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            background: var(--soft);
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            font-size: 23px;
            z-index: 2;
        }

        /* QUICK VIEW */
        .quick-view-content {
            max-width: 520px;
        }

        .quick-view-content img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            border-radius: 15px;
        }

        .quick-view-content h2 {
            margin-bottom: 10px;
        }

        .quick-view-description {
            color: #806B5D;
            line-height: 1.7;
            font-size: 14px;
        }

        .quick-view-price {
            font-size: 23px;
            font-weight: bold;
            color: var(--accent);
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 18px;
            margin: 20px 0;
        }

        .quantity-control button,
        .cart-quantity button {
            background: var(--soft);
            border: none;
            border-radius: 8px;
            width: 35px;
            height: 35px;
            font-size: 20px;
        }

        .quantity-control span {
            font-weight: bold;
            font-size: 18px;
        }

        .quick-add-btn,
        .checkout-btn {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 15px;
            font-weight: bold;
        }

        /* CART */
        .cart-content {
            max-width: 560px;
        }

        .cart-content h2 {
            text-align: center;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 18px 0;
            border-bottom: 1px solid var(--line);
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-info h4 {
            margin: 0 0 8px;
        }

        .cart-item-info p {
            margin: 0;
            color: var(--accent);
        }

        .cart-quantity {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .remove-btn {
            background: none;
            border: none;
            color: #B14F4F;
            font-size: 12px;
            margin-top: 10px;
            padding: 0;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 21px;
            font-weight: bold;
            margin: 25px 0;
        }

        .empty-cart {
            text-align: center;
            padding: 30px 0;
            color: #806B5D;
        }

        @media (max-width: 900px) {
            .product-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .product-container {
                grid-template-columns: 1fr;
            }

            .product-actions {
                flex-direction: column;
            }

            .cart-item {
                align-items: flex-start;
            }

            .modal-content {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- CART BUTTON -->
    <div class="cart-header">
        <button class="cart-box" onclick="openCart()">
            🛒 My Cart (<span id="cart-count">0</span>)
        </button>
    </div>

    <!-- MENU HEADER -->
    <div class="menu-header">
        <p>FRESHLY BAKED WITH LOVE</p>
        <h1>Our Menu</h1>
        <p>Discover your favourite sweet treats at Cozy Bake.</p>
    </div>

    <!-- CATEGORIES -->
    <div class="categories">
        <button class="active"
                onclick="filterProducts('All', this)">
            All
        </button>

        <button onclick="filterProducts('Cakes', this)">
            Cakes
        </button>

        <button onclick="filterProducts('Pastries', this)">
            Pastries
        </button>

        <button onclick="filterProducts('Cookies', this)">
            Cookies
        </button>
    </div>

    <!-- PRODUCT LIST -->
    <div class="product-container" id="product-container"></div>

    <a href="index.html" class="back-home">
        ← Return to Home
    </a>

    <!-- QUICK VIEW POPUP -->
    <div class="modal" id="quick-view-modal"
         onclick="closeQuickView(event)">

        <div class="modal-content quick-view-content">

            <button class="close-modal"
                    onclick="closeQuickView()">
                ×
            </button>

            <img id="quick-image" src="" alt="Product">

            <h2 id="quick-name"></h2>

            <p class="category-label" id="quick-category"></p>

            <p class="quick-view-description"
               id="quick-description"></p>

            <p class="quick-view-price" id="quick-price"></p>

            <div class="quantity-control">
                <strong>Quantity:</strong>

                <button onclick="changeQuickQuantity(-1)">−</button>

                <span id="quick-quantity">1</span>

                <button onclick="changeQuickQuantity(1)">+</button>
            </div>

            <button class="quick-add-btn"
                    onclick="addQuickViewToCart()"
                    id="quick-add-button">
                🛒 Add to Cart
            </button>

        </div>
    </div>

    <!-- CART POPUP -->
    <div class="modal" id="cart-modal"
         onclick="closeCart(event)">

        <div class="modal-content cart-content">

            <button class="close-modal"
                    onclick="closeCart()">
                ×
            </button>

            <h2>🛒 Your Shopping Cart</h2>

            <div id="cart-items"></div>

            <div class="cart-total">
                <span>Total:</span>
                <span id="cart-total">RM 0.00</span>
            </div>

            <button class="checkout-btn"
                    onclick="goToCheckout()">
                Proceed to Checkout
            </button>

        </div>
    </div>

    <script>
        // ======================================
        // PRODUCT DATA
        // ======================================

        const products = [
            {
                name: "Strawberry Cloud Cake",
                price: 58.90,
                category: "Cakes",
                image: "strawberrycloudcake.jpg",
                description: "A light and fluffy cake layered with fresh strawberries and whipped cream, perfect for any celebration.",
                bestseller: true
            },
            {
                name: "Morning Croissant",
                price: 8.90,
                category: "Pastries",
                image: "morningcroissant.jpg",
                description: "A golden, buttery and flaky croissant, freshly baked for a delightful morning."
            },
            {
                name: "Macaron",
                price: 18.90,
                category: "Pastries",
                image: "macaron.jpg",
                description: "Delicate French macarons with a crispy shell and a soft, delicious filling."
            },
            {
                name: "Creampuff Strawberry",
                price: 15.50,
                category: "Pastries",
                image: "creampuff.jpg",
                description: "Soft cream puffs filled with smooth cream and sweet strawberry flavour."
            },
            {
                name: "Strawberry Cheese Cake",
                price: 79.90,
                category: "Cakes",
                image: "strawberrycheesecake.jpg",
                description: "Rich and creamy cheesecake topped with fresh strawberries."
            },
            {
                name: "Cheesy Kunafa Pistachio",
                price: 16.90,
                category: "Pastries",
                image: "kunafa.jpg",
                description: "Crispy kunafa with creamy cheese and a delicious pistachio topping."
            },
            {
                name: "Chocolate Chip Cookies",
                price: 6.90,
                category: "Cookies",
                image: "chocolatechip.jpg",
                description: "Classic cookies filled with chocolate chips and baked to perfection."
            },
            {
                name: "Redvelvet Cookies",
                price: 7.90,
                category: "Cookies",
                image: "redvelvet.jpg",
                description: "Soft red velvet cookies with a rich and delightful flavour."
            },
            {
                name: "Dark Chocolate Cookies",
                price: 7.90,
                category: "Cookies",
                image: "darkchocolate.jpg",
                description: "Rich dark chocolate cookies for every chocolate lover."
            },
            {
                name: "Blueberry Cookies",
                price: 7.90,
                category: "Cookies",
                image: "blueberry.jpg",
                description: "Sweet and delicious cookies with a delightful blueberry flavour."
            }
        ];

        // ======================================
        // PHP CONNECTION
        // ======================================

        const PHP_API = {
            add: "addtocart.php",
            update: "updatecart.php",
            remove: "removecart.php"
        };

        async function callCartPHP(endpoint, data) {
            const response = await fetch(endpoint, {
                method: "POST",
                credentials: "same-origin",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            if (!response.ok) {
                throw new Error("PHP request failed");
            }

            const result = await response.json();

            if (result.success !== true) {
                throw new Error(
                    result.message || "Cart operation failed"
                );
            }

            return result;
        }

        async function syncCartWithPHP(endpoint, data) {
            try {
                await callCartPHP(endpoint, data);
                console.log("PHP cart sync successful");
            } catch (error) {
                console.warn(
                    "PHP not connected or sync failed:",
                    error
                );
            }
        }

        // ======================================
        // SHOPPING CART
        // ======================================

        let cart = [];

        try {
            const savedCart = JSON.parse(
                localStorage.getItem("cozyBakeCart") || "[]"
            );

            if (Array.isArray(savedCart)) {
                cart = savedCart.filter(item =>
                    item &&
                    typeof item.name === "string" &&
                    Number.isFinite(item.price) &&
                    Number.isInteger(item.quantity) &&
                    item.quantity > 0
                );
            }
        } catch (error) {
            cart = [];
        }

        function saveCart() {
            localStorage.setItem(
                "cozyBakeCart",
                JSON.stringify(cart)
            );

            updateCartCount();
            renderCart();
        }

        function updateCartCount() {
            const count = cart.reduce(
                (total, item) => total + item.quantity,
                0
            );

            document.getElementById("cart-count")
                .textContent = count;
        }

        function addToCart(productName, price, quantity = 1) {
            const product = products.find(
                item => item.name === productName
            );

            if (!product) {
                return;
            }

            const existing = cart.find(
                item => item.name === productName
            );

            if (existing) {
                existing.quantity += quantity;
            } else {
                cart.push({
                    name: productName,
                    price: product.price,
                    quantity: quantity
                });
            }

            saveCart();
            openCart();

            // CALL PHP
            syncCartWithPHP(PHP_API.add, {
                name: productName,
                price: product.price,
                quantity: quantity
            });
        }

        function changeQuantity(index, amount) {
            if (!cart[index]) {
                return;
            }

            const item = cart[index];
            const newQuantity = item.quantity + amount;

            if (newQuantity <= 0) {
                removeItem(index);
                return;
            }

            item.quantity = newQuantity;

            saveCart();

            // CALL PHP
            syncCartWithPHP(PHP_API.update, {
                name: item.name,
                quantity: newQuantity
            });
        }

        function removeItem(index) {
            if (!cart[index]) {
                return;
            }

            const itemName = cart[index].name;

            cart.splice(index, 1);

            saveCart();

            // CALL PHP
            syncCartWithPHP(PHP_API.remove, {
                name: itemName
            });
        }

        function renderCart() {
            const cartItems = document.getElementById("cart-items");
            const cartTotal = document.getElementById("cart-total");

            cartItems.innerHTML = "";

            let total = 0;

            if (cart.length === 0) {
                cartItems.innerHTML =
                    '<p class="empty-cart">Your cart is empty.</p>';
            }

            cart.forEach((item, index) => {
                const subtotal = item.price * item.quantity;
                total += subtotal;

                const cartItem = document.createElement("div");
                cartItem.className = "cart-item";

                const info = document.createElement("div");
                info.className = "cart-item-info";

                const name = document.createElement("h4");
                name.textContent = item.name;

                const price = document.createElement("p");
                price.textContent =
                    "RM " + item.price.toFixed(2) + " each";

                const remove = document.createElement("button");
                remove.className = "remove-btn";
                remove.textContent = "Remove";
                remove.onclick = () => removeItem(index);

                info.append(name, price, remove);

                const quantityBox = document.createElement("div");
                quantityBox.className = "cart-quantity";

                const minus = document.createElement("button");
                minus.textContent = "−";
                minus.onclick = () => changeQuantity(index, -1);

                const quantity = document.createElement("span");
                quantity.textContent = item.quantity;

                const plus = document.createElement("button");
                plus.textContent = "+";
                plus.onclick = () => changeQuantity(index, 1);

                quantityBox.append(minus, quantity, plus);

                cartItem.append(info, quantityBox);
                cartItems.appendChild(cartItem);
            });

            cartTotal.textContent = "RM " + total.toFixed(2);
        }

        function openCart() {
            renderCart();

            document.getElementById("quick-view-modal")
                .classList.remove("show");

            document.getElementById("cart-modal")
                .classList.add("show");
        }

        function closeCart(event) {
            if (
                !event ||
                event.target.id === "cart-modal"
            ) {
                document.getElementById("cart-modal")
                    .classList.remove("show");
            }
        }

        function goToCheckout() {
            if (cart.length === 0) {
                alert("Your cart is empty. Please add a product first.");
                return;
            }

            saveCart();
            window.location.href = "checkout.html";
        }

        // ======================================
        // DISPLAY PRODUCTS
        // ======================================

        function displayProducts() {
            const container = document.getElementById(
                "product-container"
            );

            container.innerHTML = "";

            products.forEach((product, index) => {
                const card = document.createElement("div");
                card.className = "product-card";
                card.dataset.category = product.category;

                const imageBox = document.createElement("div");
                imageBox.className = "product-image";
                imageBox.onclick = () => openQuickView(index);

                const image = document.createElement("img");
                image.src = product.image;
                image.alt = product.name;

                imageBox.appendChild(image);

                if (product.bestseller) {
                    const badge = document.createElement("span");
                    badge.className = "badge";
                    badge.textContent = "BEST SELLER";
                    imageBox.appendChild(badge);
                }

                const details = document.createElement("div");
                details.className = "product-details";

                const name = document.createElement("h3");
                name.textContent = product.name;

                const description = document.createElement("p");
                description.className = "description";
                description.textContent = product.description;

                const category = document.createElement("p");
                category.className = "category-label";
                category.textContent = product.category;

                const price = document.createElement("h4");
                price.className = "price";
                price.textContent =
                    "RM " + product.price.toFixed(2);

                const actions = document.createElement("div");
                actions.className = "product-actions";

                const quickButton = document.createElement("button");
                quickButton.className = "quick-view-btn";
                quickButton.textContent = "👁 Quick View";
                quickButton.onclick = () => openQuickView(index);

                const cartButton = document.createElement("button");
                cartButton.className = "add-to-cart";
                cartButton.textContent = "🛒 Add to Cart";
                cartButton.onclick = () => {
                    addToCart(product.name, product.price);
                };

                actions.append(quickButton, cartButton);

                details.append(
                    name,
                    description,
                    category,
                    price,
                    actions
                );

                card.append(imageBox, details);
                container.appendChild(card);
            });
        }

        // ======================================
        // CATEGORY FILTER
        // ======================================

        function filterProducts(category, clickedButton) {
            document.querySelectorAll(".categories button")
                .forEach(button => {
                    button.classList.remove("active");
                });

            clickedButton.classList.add("active");

            document.querySelectorAll(".product-card")
                .forEach(card => {
                    if (
                        category === "All" ||
                        card.dataset.category === category
                    ) {
                        card.style.display = "block";
                    } else {
                        card.style.display = "none";
                    }
                });
        }

        // ======================================
        // QUICK VIEW PRODUCT
        // ======================================

        let selectedProduct = null;
        let quickQuantity = 1;

        function openQuickView(index) {
            selectedProduct = products[index];
            quickQuantity = 1;

            document.getElementById("quick-image").src =
                selectedProduct.image;

            document.getElementById("quick-image").alt =
                selectedProduct.name;

            document.getElementById("quick-name").textContent =
                selectedProduct.name;

            document.getElementById("quick-category").textContent =
                selectedProduct.category;

            document.getElementById("quick-description").textContent =
                selectedProduct.description;

            document.getElementById("quick-quantity").textContent =
                quickQuantity;

            updateQuickPrice();

            document.getElementById("quick-view-modal")
                .classList.add("show");
        }

        function updateQuickPrice() {
            if (!selectedProduct) {
                return;
            }

            const total = selectedProduct.price * quickQuantity;

            document.getElementById("quick-price").textContent =
                "RM " + selectedProduct.price.toFixed(2) + " each";

            document.getElementById("quick-add-button").textContent =
                "🛒 Add to Cart — RM " + total.toFixed(2);
        }

        function changeQuickQuantity(amount) {
            quickQuantity = Math.max(
                1,
                quickQuantity + amount
            );

            document.getElementById("quick-quantity").textContent =
                quickQuantity;

            updateQuickPrice();
        }

        function addQuickViewToCart() {
            if (!selectedProduct) {
                return;
            }

            addToCart(
                selectedProduct.name,
                selectedProduct.price,
                quickQuantity
            );
        }

        function closeQuickView(event) {
            if (
                !event ||
                event.target.id === "quick-view-modal"
            ) {
                document.getElementById("quick-view-modal")
                    .classList.remove("show");
            }
        }

       
        document.addEventListener("keydown", function(event) {
            if (event.key === "Escape") {
                closeQuickView();
                closeCart();
            }
        });

        // ======================================
        // INITIALIZE
        // ======================================

        displayProducts();
        updateCartCount();
        renderCart();

    </script>

</body>
</html>
