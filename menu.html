<!DOCTYPE html>
<html lang="en">

<head>
    <title>Cozy Bake | Menu</title>
</head>
<style>
    body {
        margin: 0;
        background-color: #FAF8F5;
        font-family: Arial, sans-serif;
    }

    .menu-header {
        text-align: center;
        padding: 60px 20px;
    }

    .menu-header h1 {
        font-family: hajar;
        font-size: 75px;
        color: #3D281B;
        margin: 15px 0;
    }

    .menu-header p {
        color: #B58D6D;
        font-size: 14px;
    }
    .categories {
    display: flex;
    justify-content: center;
    gap: 10px;
    background-color: #F1E7DF;
    width: fit-content;
    margin: 0 auto 50px;
    padding: 8px;
    border-radius: 20px;
}

.categories button {
    background-color: transparent;
    border: none;
    padding: 15px 25px;
    border-radius: 15px;
    color: #3D281B;
    font-weight: bold;
    cursor: pointer;
}

.categories button:first-child {
    background-color: #B58D6D;
    color: white;
}
</style>
<body>
<section class="menu-header">
    <p>COZY BAKE</p>
    <h1>Our Fresh Bakes</h1>
    <p>Discover cakes, pastries, and everyday comforts baked fresh in our kitchens.</p>
</section>
<div class="categories">
    <button>All</button>
    <button>Cakes</button>
    <button>Pastries</button>
    <button>Cookies</button>
</div>
</body>

</html>
